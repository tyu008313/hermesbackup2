<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود حرفه‌ای باشگاه</title>
    <style>
        :root { --primary: #2563EB; --accent: #EA580C; --bg: #0f172a; }
        body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); font-family: 'Vazirmatn', sans-serif; overflow: hidden; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .login-box { position: relative; z-index: 2; background: rgba(255,255,255,0.1); padding: 2rem; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); text-align: center; color: white; transition: transform 0.5s; }
        button { background: var(--accent); color: white; border: none; padding: 15px 40px; border-radius: 30px; font-size: 1.2rem; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(234, 88, 12, 0.4); }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="login-box" id="box">
        <h1>خوش آمدید به باشگاه</h1>
        <button id="loginBtn">ورود به باشگاه</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ساخت درب سه‌بعدی
        const doorGroup = new THREE.Group();
        const doorGeo = new THREE.BoxGeometry(2, 4, 0.2);
        const doorMat = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
        const door = new THREE.Mesh(doorGeo, doorMat);
        door.position.x = 1;
        doorGroup.add(door);
        scene.add(doorGroup);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.z = 6;

        document.getElementById('loginBtn').onclick = () => {
            document.getElementById('box').style.transform = "scale(0)";
            // انیمیشن باز شدن در
            let angle = 0;
            function openDoor() {
                if (angle < Math.PI / 2) {
                    angle += 0.05;
                    doorGroup.rotation.y = -angle;
                    requestAnimationFrame(openDoor);
                } else {
                    alert("خوش آمدید! در باز شد.");
                }
            }
            openDoor();
        };

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
